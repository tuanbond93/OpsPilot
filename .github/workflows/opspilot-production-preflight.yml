            else if (mode === "dry-run") await dryRun();
            else if (mode === "apply") await applyBackfill();
            else if (mode === "verify") await verifyAll();
            else throw new Error("MODE_INVALID");
          }
          main().catch((error) => {
            const code = error instanceof Error ? error.message.split(":")[0] : "UNKNOWN";
            console.error("PRODUCTION_094_GATE=FAIL; CATEGORY=" + code);
            process.exitCode = 1;
          });
