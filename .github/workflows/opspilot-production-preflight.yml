          async function applyBackfill(): Promise<void> {
            requireEnv("APPROVE_DATABASE_MUTATIONS");
            if (process.env.APPROVE_DATABASE_MUTATIONS !== "YES") throw new Error("DATABASE_MUTATION_APPROVAL_REQUIRED");
            let cursor: string | null = null;
            let completed = 0;
            const expected = Number(requireEnv("BACKFILL_WOULD_MIGRATE"));
            for (;;) {
              const result = await runFollowupCohortBackfillBatch(client, {
                apply: true,
                afterId: cursor,
                limit: 1,
              });
              if (result.selected === 0) break;
              if (result.failed !== 0 || result.skipped !== 0 || result.backfilled !== 1 || !result.nextCursor) {
                console.log("BACKFILL_APPLY=STOPPED_ON_FIRST_NON_SUCCESS");
                console.log("BACKFILL_CASES_COMPLETED=" + completed);
                throw new Error("BACKFILL_CASE_FAILED_OR_SKIPPED");
              }
              cursor = result.nextCursor;
              completed++;
            }
            console.log("BACKFILL_APPLY=PASS");
            console.log("BACKFILL_CASES_COMPLETED=" + completed);
            if (completed !== expected) throw new Error("BACKFILL_COUNT_DIFFERS_FROM_DRY_RUN");
          }
          function stable(value: any): any {
            if (Array.isArray(value)) return value.map(stable);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]));
            }
            return value;
          }
          async function allActiveCohortCases(afterId: string | null): Promise<any[]> {
            let q = (client.from("followup_cases") as any)
              .select(V1_FIELDS)
              .neq("current_state", "CLOSED")
              .not("operational_cohort", "is", null)
              .order("id", { ascending: true })
              .limit(PAGE_CASES);
            if (afterId) q = q.gt("id", afterId);
            const { data, error } = await q;
            if (error) throw new Error("ACTIVE_COHORT_VERIFY_READ_FAILED");
            return data || [];
          }
          async function readMembers(caseId: string, generationId: string): Promise<any[]> {
            const rows: any[] = [];
            for (let offset = 0; ; offset += MEMBER_PAGE) {
              const { data, error } = await (client.from("followup_case_members") as any)
                .select(MEMBER_FIELDS)
                .eq("followup_case_id", caseId)
                .eq("generation_id", generationId)
                .order("order_code", { ascending: true })
                .range(offset, offset + MEMBER_PAGE - 1);
              if (error) throw new Error("MEMBER_GENERATION_READ_FAILED");
              const page = data || [];
              rows.push(...page);
              if (page.length < MEMBER_PAGE) return rows;
            }
          }
          async function verifyAll(): Promise<void> {
            let cursor: string | null = null;
            let verified = 0;
            let invalidParents = 0;
            for (;;) {
              const cases = await allActiveCohortCases(cursor);
              if (!cases.length) break;
              const ids = cases.map((row: any) => row.id);
              const { data: archives, error: archiveError } = await (client.from("followup_case_cohort_archive") as any)
                .select("followup_case_id,original_operational_cohort,source_case_updated_at,source_cohort_sha256")
                .in("followup_case_id", ids);
              if (archiveError) throw new Error("ARCHIVE_PARITY_READ_FAILED");
              const archiveByCase = new Map((archives || []).map((row: any) => [row.followup_case_id, row]));
              for (const row of cases) {
                const pointer = row.member_generation_id;
                const metadata = row.operational_cohort;
                const archive: any = archiveByCase.get(row.id);
                if (row.cohort_version !== 2 || !pointer || !isOperationalCohortV2Metadata(metadata) || !archive) {
                  invalidParents++;
                  continue;
                }
                const legacy = archive.original_operational_cohort;
                if (!legacy || legacy.version !== 1 || archive.source_cohort_sha256 !== sha(legacy)) {
                  throw new Error("LEGACY_ARCHIVE_INVALID");
                }
                const expectedMetadata = operationalCohortV2Metadata(legacy);
                if (JSON.stringify(stable(metadata)) !== JSON.stringify(stable(expectedMetadata))) {
                  throw new Error("PARENT_METADATA_PARITY_MISMATCH");
                }
                const { data: generations, error: generationError } = await (client.from("followup_case_member_generations") as any)
                  .select("followup_case_id,generation_id,source_sync_run_id,expected_member_count,generation_status,committed_at")
                  .eq("followup_case_id", row.id)
                  .eq("generation_id", pointer);
                if (generationError) throw new Error("GENERATION_MANIFEST_READ_FAILED");
                const generation = generations?.[0];
                if (!generation || generation.generation_status !== "COMMITTED" || !generation.committed_at
                    || generation.expected_member_count !== legacy.members.length) {
                  throw new Error("GENERATION_MANIFEST_INVALID");
                }
                const expectedRows = operationalCohortMemberRows(row.id, pointer, null, legacy);
                const actualRows = await readMembers(row.id, pointer);
                assertFollowupMemberGenerationParity(expectedRows, actualRows);
                if (actualRows.length !== metadata.memberCount) throw new Error("METADATA_MEMBER_COUNT_MISMATCH");
                verified++;
              }
              cursor = cases[cases.length - 1].id;
              if (cases.length < PAGE_CASES) break;
            }
            const { count: remaining, error: remainingError } = await (client.from("followup_cases") as any)
              .select("id", { count: "exact", head: true })
              .neq("current_state", "CLOSED")
              .not("operational_cohort", "is", null)
              .is("member_generation_id", null)
              .or("cohort_version.is.null,cohort_version.eq.1");
            if (remainingError) throw new Error("REMAINING_V1_COUNT_FAILED");
            const nullCases = await countNullCohortV1();
            const expected = Number(requireEnv("BACKFILL_WOULD_MIGRATE"));
            if (invalidParents !== 0 || (remaining || 0) !== 0 || verified !== expected) {
              throw new Error("POINTER_OR_BACKFILL_COUNT_MISMATCH");
            }
            appendFileSync(requireEnv("GITHUB_ENV"), "BACKFILL_NULL_CASES_FINAL=" + nullCases + "\n");
            console.log("BACKFILL_PARITY=PASS");
            console.log("V2_CASES_VERIFIED=" + verified);
            console.log("NULL_COHORT_V1_CASES_REMAINING=" + nullCases);
            console.log("INVALID_POINTERS=0");
            console.log("MISSING_GENERATIONS=0");
            console.log("KEYSET_OR_FIELD_MISMATCHES=0");
          }
          async function main(): Promise<void> {
            requireEnv("PROD_SUPABASE_URL");
            requireEnv("PROD_SERVICE_ROLE_KEY");
            const url = new URL(process.env.PROD_SUPABASE_URL!);
            if (url.hostname !== "elwnbwimgzijuelfjdsq.supabase.co") throw new Error("PRODUCTION_IDENTITY_MISMATCH");
            const mode = process.argv[2];
