name: OpsPilot Production Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opspilot-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: opspilot-production-rollout
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify project identity before database access
        id: identity
        shell: bash
        env:
          PGHOST: ${{ secrets.PROD_DB_HOST }}
          PGPORT: ${{ secrets.PROD_DB_PORT }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGDATABASE: ${{ secrets.PROD_DB_NAME }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          python - <<'PY
          import os,sys
          ref="elwnbwimgzijuelfjdsq"
          shadow="qkrpbompjwxfpicjfoub"
          identity_names=("PGHOST","PGUSER")
          if any(not os.environ.get(k) for k in identity_names):
            print("PRODUCTION_IDENTITY=FAIL; REASON=TARGET_FIELDS_MISSING")
            sys.exit(1)
          host=os.environ["PGHOST"].strip().lower().rstrip(".")
          user=os.environ["PGUSER"].strip().lower()
          database=os.environ.get("PGDATABASE", "").strip().lower()
          if shadow in host or shadow in user or shadow in database:
            print("PRODUCTION_IDENTITY=FAIL; REASON=SHADOW_REF_REJECTED")
            sys.exit(1)
          direct=(host=="db."+ref+".supabase.co" and user in ("postgres","postgres."+ref))
          pooler=(host.endswith(".pooler.supabase.com") and user=="postgres."+ref)
          if not (direct or pooler):
            print("PRODUCTION_IDENTITY=FAIL; REASON=PRODUCTION_REF_UNVERIFIED")
            sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
            out.write("identity_ok=true\n")
          print("PRODUCTION_IDENTITY=PASS")
          print("PRODUCTION_PROJECT_REF="+ref)
          PY
      - name: Install psql client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Create read-only audit helper
        if: steps.identity.outputs.identity_ok == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/preflight.py" <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          baseline=Path(os.environ["RUNNER_TEMP"])/"preflight.json"
          SQL = r"""
          BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SET LOCAL statement_timeout='8000ms';
          WITH
          artifacts AS (
            SELECT to_regclass('public.followup_case_members') IS NOT NULL AS members,
                   to_regclass('public.followup_case_member_generations') IS NOT NULL AS generations,
                   to_regclass('public.followup_case_cohort_archive') IS NOT NULL AS archive,
                   to_regprocedure('public.cleanup_followup_case_member_generations(boolean,integer,integer)') IS NOT NULL AS cleanup
          ),
          parent_columns AS (
            SELECT COALESCE(array_agg(column_name ORDER BY column_name), ARRAY[]::text[]) AS names
            FROM information_schema.columns
            WHERE table_schema='public' AND table_name='followup_cases'
          ),
          cases AS (
            SELECT count(*) AS total,
                   count(*) FILTER (WHERE COALESCE(current_state::text,'') <> 'CLOSED') AS active,
                   count(*) FILTER (WHERE current_state::text='CLOSED') AS closed,
                   count(*) FILTER (WHERE current_state::text='RESOLVED') AS resolved,
                   count(*) FILTER (WHERE COALESCE(current_state::text,'') <> 'CLOSED' AND operational_cohort IS NULL) AS active_null,
                   count(*) FILTER (WHERE COALESCE(current_state::text,'') <> 'CLOSED' AND operational_cohort->>'version'='1') AS active_v1
            FROM public.followup_cases
          ),
          v1 AS (
            SELECT id, operational_cohort, octet_length(operational_cohort::text) AS bytes
            FROM public.followup_cases
            WHERE COALESCE(current_state::text,'') <> 'CLOSED' AND operational_cohort->>'version'='1'
          ),
          member_stats AS (
            SELECT v.id, count(m.value) AS members,
                   count(DISTINCT NULLIF(btrim(m.value->>'orderCode'),'')) AS distinct_codes,
                   count(m.value) FILTER (
                     WHERE NULLIF(btrim(m.value->>'customerId'),'') IS NULL
                        OR NULLIF(btrim(m.value->>'warehouseId'),'') IS NULL
                        OR NULLIF(btrim(m.value->>'status'),'') IS NULL
                        OR NULLIF(btrim(m.value->>'baselineStatus'),'') IS NULL
                        OR NULLIF(btrim(m.value->>'observedAt'),'') IS NULL
                        OR COALESCE(m.value->>'stage','') NOT IN ('DELIVERY','TRANSIT','OUTBOUND','UNKNOWN')
                   ) AS invalid_members
            FROM v1 v
            LEFT JOIN LATERAL jsonb_array_elements(
              CASE WHEN jsonb_typeof(v.operational_cohort->'members')='array'
                   THEN v.operational_cohort->'members' ELSE '[]'::jsonb END
            ) m(value) ON true
            GROUP BY v.id
          ),
          quality AS (
            SELECT
              (SELECT count(*) FROM v1 WHERE jsonb_typeof(operational_cohort->'members') IS DISTINCT FROM 'array') AS missing_members,
              (SELECT count(*) FROM v1 WHERE jsonb_typeof(operational_cohort->'baselineCodes') IS DISTINCT FROM 'array') AS missing_baseline_codes,
              COALESCE((SELECT count(*) FROM member_stats WHERE members<>distinct_codes),0) AS duplicate_or_empty_keys,
              COALESCE((SELECT count(*) FROM member_stats WHERE invalid_members>0),0) AS invalid_required_fields,
              (SELECT count(*) FROM v1 v LEFT JOIN member_stats m ON m.id=v.id
               WHERE jsonb_typeof(v.operational_cohort->'members') IS DISTINCT FROM 'array'
                  OR jsonb_typeof(v.operational_cohort->'baselineCodes') IS DISTINCT FROM 'array'
                  OR COALESCE(m.members,0)<>COALESCE(m.distinct_codes,0)
                  OR COALESCE(m.invalid_members,0)>0) AS backfill_failures,
              COALESCE((SELECT max(members) FROM member_stats),0) AS largest_members,
              COALESCE((SELECT max(bytes) FROM v1),0) AS largest_bytes,
              (SELECT count(*) FROM v1) AS active_v1
          ),
          runs AS (
            SELECT count(*) AS active_runs FROM public.sync_runs
            WHERE lower(status::text) IN ('running','dispatching')
          ),
          recoveries AS (
            SELECT count(*) FILTER (WHERE upper(status::text) IN ('DISPATCHING','RUNNING')) AS active,
                   count(*) FILTER (WHERE upper(status::text)='PENDING') AS pending
            FROM public.checkpoint_recoveries
          ),
          jobs AS (
            SELECT COALESCE(jsonb_agg(jsonb_build_object(
                     'jobid',jobid,'jobname',jobname,'schedule',schedule,'active',active
                   ) ORDER BY jobid),'[]'::jsonb) AS rows,
                   (count(*)=4 AND bool_and(active IS FALSE)) AS all_off
            FROM cron.job WHERE jobid IN (14,15,16,17)
          ),
          case_state AS (
            SELECT count(*) AS rows,
                   md5(COALESCE(string_agg(id::text||':'||COALESCE(updated_at::text,''),'|' ORDER BY id),'')) AS state
            FROM public.followup_cases
          ),
          schema_digest AS (
            SELECT md5(
              COALESCE((SELECT string_agg(table_name||'.'||ordinal_position::text||'.'||column_name||':'||data_type||':'||udt_name||':'||is_nullable||':'||COALESCE(column_default,''),'|' ORDER BY table_name,ordinal_position)
                FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')),'')
              || COALESCE((SELECT string_agg(tablename||':'||indexname||':'||indexdef,'|' ORDER BY tablename,indexname)
                FROM pg_indexes WHERE schemaname='public' AND tablename IN ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')),'')
              || COALESCE((SELECT string_agg(cl.relname||':'||co.conname||':'||pg_get_constraintdef(co.oid,true),'|' ORDER BY cl.relname,co.conname)
                FROM pg_constraint co JOIN pg_class cl ON cl.oid=co.conrelid JOIN pg_namespace ns ON ns.oid=cl.relnamespace
                WHERE ns.nspname='public' AND cl.relname IN ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')),'')
              || COALESCE((SELECT string_agg(tablename||':'||policyname||':'||permissive||':'||roles::text||':'||cmd||':'||COALESCE(qual,'')||':'||COALESCE(with_check,''),'|' ORDER BY tablename,policyname)
                FROM pg_policies WHERE schemaname='public' AND tablename IN ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')),'')
            ) AS digest
          )
          SELECT jsonb_build_object(
            'database_mb',round(pg_database_size(current_database())/1048576.0,2),
            'active_connections',(SELECT count(*) FROM pg_stat_activity WHERE datname=current_database() AND backend_type='client backend'),
            'migration_094_present',((SELECT members OR generations OR archive OR cleanup FROM artifacts)
                OR ('cohort_version'=ANY((SELECT names FROM parent_columns)))
                OR ('member_generation_id'=ANY((SELECT names FROM parent_columns)))),
            'migration_artifacts',(SELECT to_jsonb(artifacts) FROM artifacts),
            'parent_generation_columns',jsonb_build_object('cohort_version','cohort_version'=ANY((SELECT names FROM parent_columns)),
                'member_generation_id','member_generation_id'=ANY((SELECT names FROM parent_columns))),
            'cases',(SELECT to_jsonb(cases) FROM cases),
            'quality',(SELECT to_jsonb(quality) FROM quality),
            'backfill_would_fail',(SELECT backfill_failures FROM quality),
            'active_runs',(SELECT active_runs FROM runs),
            'recoveries',(SELECT to_jsonb(recoveries) FROM recoveries),
            'active_checkpoint_in_progress',((SELECT active_runs FROM runs)>0 OR (SELECT active FROM recoveries)>0),
            'cron_jobs',(SELECT rows FROM jobs),
            'cron_all_off',(SELECT all_off FROM jobs),
            'schema_digest',(SELECT digest FROM schema_digest),
            'case_state',(SELECT to_jsonb(case_state) FROM case_state)
          )::text;
          ROLLBACK;
          """
          def psql(sql):
            try:
              result=subprocess.run(["psql","-X","-qAt","-v","ON_ERROR_STOP=1","-c",sql],
                capture_output=True,text=True,timeout=90,check=False)
            except Exception:
              return None,None
            if result.returncode != 0: return None,result.returncode
            return result.stdout.strip(),0
          mode=sys.argv[1]
          output,query_rc=psql(SQL)
          if query_rc is None or query_rc != 0:
            print("DB_CONNECTION=PASS; READ_ONLY_QUERY=FAIL; psql diagnostics suppressed"); sys.exit(3)
          try: data=json.loads(output)
          except Exception:
            print("DB_CONNECTION=PASS; READ_ONLY_QUERY=FAIL; result parsing failed"); sys.exit(4)
          quality=data["quality"]
          active=data["cases"]["active"]
          active_v1=quality["active_v1"]
          data["backfill_dry_run"]="READ_ONLY_PREFLIGHT_ONLY"
          data["backfill_eligible"]=max(active_v1-data["backfill_would_fail"],0)
          data["backfill_would_migrate"]=data["backfill_eligible"]
          data["backfill_would_skip"]=max(active-active_v1,0)
          if mode=="pre":
            data["precheck_pass"]=(not data["migration_094_present"] and not data["active_checkpoint_in_progress"]
              and data["recoveries"]["pending"]==0 and data["cron_all_off"] and data["backfill_would_fail"]==0)
            baseline.write_text(json.dumps(data,sort_keys=True),encoding="utf-8")
            with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("precheck_pass="+str(data["precheck_pass"]).lower()+"\n")
          else:
            if not baseline.exists():
              print("NO_MUTATION_ASSERTION=NOT_RUN; no successful preflight baseline"); sys.exit(5)
            before=json.loads(baseline.read_text(encoding="utf-8"))
            data["no_mutation_assertion"]="PASS" if (not data["migration_094_present"]
              and data["schema_digest"]==before["schema_digest"] and data["case_state"]==before["case_state"]
              and data["cron_jobs"]==before["cron_jobs"]) else "FAIL"
          safe=json.dumps(data,sort_keys=True,default=str)
          print(safe)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
            out.write("Read-only Production preflight "+mode+"\n"+safe+"\n")
          if mode=="pre":
            print("BACKFILL_DRY_RUN=READ_ONLY_PREFLIGHT_ONLY")
            print("V3=UNKNOWN; not read from verified runtime metadata")
            if not data["precheck_pass"]: sys.exit(6)
          elif data["no_mutation_assertion"]!="PASS": sys.exit(7)
          PY

      - name: Verify PostgreSQL connection
        id: connection
        if: steps.identity.outputs.identity_ok == 'true'
        shell: bash
        env:
          PGHOST: ${{ secrets.PROD_DB_HOST }}
          PGPORT: ${{ secrets.PROD_DB_PORT }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGDATABASE: ${{ secrets.PROD_DB_NAME }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -Atqc "select current_database(), current_user, version();" >"$RUNNER_TEMP/pg-connect.stdout" 2>"$RUNNER_TEMP/pg-connect.stderr"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "DB_CONNECTION=PASS"
            echo "connected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          category=$(python - "$RUNNER_TEMP/pg-connect.stderr" <<'PY
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors="replace").lower()
          rules=[
            ("DNS_FAILURE",r"could not translate host name|name or service not known|temporary failure in name resolution|no such host"),
            ("TLS_FAILURE",r"ssl error|tls error|certificate verify|certificate validation|no pg_hba.conf entry.*ssl|ssl is required"),
            ("AUTH_FAILURE",r"password authentication failed|no password supplied|role .* does not exist|authentication failed"),
            ("DATABASE_FAILURE",r"database .* does not exist|invalid catalog name"),
            ("NETWORK_FAILURE",r"connection timed out|connection refused|no route to host|network is unreachable|could not connect to server|connection reset"),
          ]
          for name,pattern in rules:
            if re.search(pattern,raw,re.S):
              print(name)
              break
          else:
            print("UNKNOWN")
          PY
          )
          echo "DB_CONNECTION=FAIL"
          echo "DB_FAILURE_CATEGORY=$category"
          echo "connected=false" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Production database read-only preflight
        id: preflight
        if: steps.connection.outputs.connected == 'true'
        env:
          PGHOST: ${{ secrets.PROD_DB_HOST }}
          PGPORT: ${{ secrets.PROD_DB_PORT }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGDATABASE: ${{ secrets.PROD_DB_NAME }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
        run: python "$RUNNER_TEMP/preflight.py" pre
      - name: Final read-only no-mutation assertion
        if: always() && steps.identity.outputs.identity_ok == 'true' && steps.preflight.outcome == 'success'
        env:
          PGHOST: ${{ secrets.PROD_DB_HOST }}
          PGPORT: ${{ secrets.PROD_DB_PORT }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGDATABASE: ${{ secrets.PROD_DB_NAME }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
        run: python "$RUNNER_TEMP/preflight.py" post
      - name: Report unavailable deployment metadata
        if: always()
        run: |
          echo "Production app commit: NOT_AVAILABLE_IN_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "V3 runtime: UNKNOWN; no Vercel metadata credential is configured." >> "$GITHUB_STEP_SUMMARY"
          echo "SAFE_TO_BEGIN_094_ROLLOUT: NO while V3 remains unverified." >> "$GITHUB_STEP_SUMMARY"
          echo "No database write, migration, backfill, cron change, deployment, or V3 change was made." >> "$GITHUB_STEP_SUMMARY"
