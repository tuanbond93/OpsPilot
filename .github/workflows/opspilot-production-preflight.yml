name: OpsPilot Production Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opspilot-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: opspilot-production-rollout
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify project identity before database access
        id: identity
        shell: bash
        env:
          PROD_SUPABASE_URL: __GITHUB_EXPR_OPEN__ secrets.PROD_SUPABASE_URL __GITHUB_EXPR_CLOSE__
          PROD_SERVICE_ROLE_KEY: __GITHUB_EXPR_OPEN__ secrets.PROD_SERVICE_ROLE_KEY __GITHUB_EXPR_CLOSE__
          PROD_DATABASE_URL: __GITHUB_EXPR_OPEN__ secrets.PROD_DATABASE_URL __GITHUB_EXPR_CLOSE__
        run: |
          python - <<'PY'
          import os,sys
          from urllib.parse import urlparse,unquote
          ref="elwnbwimgzijuelfjdsq"
          shadow="qkrpbompjwxfpicjfoub"
          names=("PROD_SUPABASE_URL","PROD_SERVICE_ROLE_KEY","PROD_DATABASE_URL")
          if any(not os.environ.get(k) for k in names):
            print("PRODUCTION_IDENTITY=FAIL: required secret missing"); sys.exit(1)
          try:
            s=urlparse(os.environ["PROD_SUPABASE_URL"])
            d=urlparse(os.environ["PROD_DATABASE_URL"])
            sh=(s.hostname or "").lower()
            dh=(d.hostname or "").lower()
            du=unquote(d.username or "")
          except Exception:
            print("PRODUCTION_IDENTITY=FAIL: invalid connection metadata"); sys.exit(1)
          if shadow in sh or shadow in dh or shadow in du:
            print("PRODUCTION_IDENTITY=FAIL: Shadow explicitly rejected"); sys.exit(1)
          direct=dh=="db."+ref+".supabase.co" and du in ("postgres","postgres."+ref)
          pooler=dh.endswith(".pooler.supabase.com") and du.split(".")[-1]==ref
          if s.scheme!="https" or sh!=ref+".supabase.co" or not (direct or pooler):
            print("PRODUCTION_IDENTITY=FAIL: project reference mismatch"); sys.exit(1)
          open(os.environ["GITHUB_OUTPUT"],"a").write("identity_ok=true\n")
          print("PRODUCTION_IDENTITY=PASS")
          print("PRODUCTION_PROJECT_REF="+ref)
          PY

      - name: Install read-only database client
        if: steps.identity.outputs.identity_ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg
        if: steps.identity.outputs.identity_ok == 'true'
        run: python -m pip install --disable-pip-version-check --no-input "psycopg[binary]==3.2.9"

      - name: Create read-only audit helper
        if: steps.identity.outputs.identity_ok == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/preflight.py" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row
          baseline=Path(os.environ["RUNNER_TEMP"])/"preflight.json"
          def snapshot(cur):
            cur.execute("SELECT round(pg_database_size(current_database())/1048576.0,2) AS mb")
            mb=cur.fetchone()["mb"]
            cur.execute("""SELECT count(*) FILTER(WHERE backend_type='client backend') AS total,
              count(*) FILTER(WHERE backend_type='client backend' AND pid<>pg_backend_pid() AND state='active') AS active
              FROM pg_stat_activity WHERE datname=current_database()""")
            connections=cur.fetchone()
            cur.execute("""SELECT to_regclass('public.followup_case_members') IS NOT NULL AS members,
              to_regclass('public.followup_case_member_generations') IS NOT NULL AS generations,
              to_regclass('public.followup_case_cohort_archive') IS NOT NULL AS archive,
              to_regprocedure('public.cleanup_followup_case_member_generations(boolean,integer,integer)') IS NOT NULL AS cleanup""")
            artifacts=cur.fetchone()
            cur.execute("""SELECT column_name FROM information_schema.columns
              WHERE table_schema='public' AND table_name='followup_cases'""")
            cols={r["column_name"] for r in cur.fetchall()}
            pointers=sorted({"cohort_version","member_generation_id"} & cols)
            tracker=None
            for relation in ("supabase_migrations.schema_migrations","public.schema_migrations"):
              cur.execute("SELECT to_regclass(%s) IS NOT NULL AS present",(relation,))
              if cur.fetchone()["present"]:
                sch,tab=relation.split(".")
                cur.execute("""SELECT column_name FROM information_schema.columns
                  WHERE table_schema=%s AND table_name=%s""",(sch,tab))
                tracker_cols={r["column_name"] for r in cur.fetchall()}
                if "version" in tracker_cols:
                  cur.execute("SELECT EXISTS(SELECT 1 FROM "+sch+"."+tab+" WHERE version::text LIKE %s) AS found",("%094%",))
                  tracker=cur.fetchone()["found"]
                  if tracker: break
            migration=any(artifacts.values()) or bool(pointers) or tracker is True
            cur.execute("""SELECT count(*) AS total,
              count(*) FILTER(WHERE current_state<>'CLOSED') AS active,
              count(*) FILTER(WHERE current_state='CLOSED') AS closed,
              count(*) FILTER(WHERE current_state='RESOLVED') AS resolved,
              count(*) FILTER(WHERE current_state<>'CLOSED' AND operational_cohort IS NULL) AS active_null,
              count(*) FILTER(WHERE current_state<>'CLOSED' AND operational_cohort->>'version'='1') AS active_v1
              FROM public.followup_cases""")
            cases=cur.fetchone()
            cur.execute("""WITH v AS (
              SELECT operational_cohort,octet_length(operational_cohort::text) AS bytes
              FROM public.followup_cases
              WHERE current_state<>'CLOSED' AND operational_cohort->>'version'='1'
            ), m AS (
              SELECT v.id, v.operational_cohort,
                count(x.value) AS members,
                count(DISTINCT NULLIF(x.value->>'orderCode','')) AS distinct_codes
              FROM v CROSS JOIN LATERAL jsonb_array_elements(
                CASE WHEN jsonb_typeof(v.operational_cohort->'members')='array'
                  THEN v.operational_cohort->'members' ELSE '[]'::jsonb END) x(value)
              GROUP BY v.id,v.operational_cohort
            )
            SELECT (SELECT count(*) FROM v WHERE jsonb_typeof(operational_cohort->'members') IS DISTINCT FROM 'array') AS missing_members,
              (SELECT count(*) FROM v WHERE bytes>131072) AS oversized_128k,
              (SELECT count(*) FROM v WHERE bytes>262144) AS oversized_256k,
              COALESCE((SELECT max(members) FROM m),0) AS largest_members,
              COALESCE((SELECT max(bytes) FROM v),0) AS largest_bytes,
              COALESCE((SELECT count(*) FROM m WHERE members<>distinct_codes),0) AS duplicate_or_empty_keys""")
            quality=cur.fetchone()
            cur.execute("""SELECT count(*) AS active_runs FROM public.sync_runs
              WHERE lower(status::text) IN ('running','dispatching')""")
            runs=cur.fetchone()["active_runs"]
            cur.execute("""SELECT count(*) FILTER(WHERE upper(status::text) IN ('DISPATCHING','RUNNING')) AS active,
              count(*) FILTER(WHERE upper(status::text)='PENDING') AS pending
              FROM public.checkpoint_recoveries""")
            recoveries=cur.fetchone()
            cur.execute("SELECT jobid,jobname,schedule,active FROM cron.job WHERE jobid IN (14,15,16,17) ORDER BY jobid")
            jobs=cur.fetchall()
            cron_pass=len(jobs)==4 and all(r["active"] is False for r in jobs)
            cur.execute("""SELECT table_name,ordinal_position,column_name,data_type,udt_name,is_nullable,column_default
              FROM information_schema.columns WHERE table_schema='public'
              AND table_name IN ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')
              ORDER BY table_name,ordinal_position""")
            schema=cur.fetchall()
            cur.execute("""SELECT tablename,indexname,indexdef FROM pg_indexes
              WHERE schemaname='public' AND tablename IN ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')
              ORDER BY tablename,indexname""")
            indexes=cur.fetchall()
            cur.execute("""SELECT cl.relname,co.conname,pg_get_constraintdef(co.oid,true) AS definition
              FROM pg_constraint co JOIN pg_class cl ON cl.oid=co.conrelid
              JOIN pg_namespace ns ON ns.oid=cl.relnamespace
              WHERE ns.nspname='public' AND cl.relname IN
                ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')
              ORDER BY cl.relname,co.conname""")
            constraints=cur.fetchall()
            cur.execute("""SELECT tablename,policyname,permissive,roles,cmd,qual,with_check
              FROM pg_policies WHERE schemaname='public' AND tablename IN
                ('followup_cases','followup_case_members','followup_case_member_generations','followup_case_cohort_archive')
              ORDER BY tablename,policyname""")
            policies=cur.fetchall()
            digest=hashlib.sha256(json.dumps([schema,indexes,constraints,policies],sort_keys=True,default=str,separators=(",",":")).encode()).hexdigest()
            cur.execute("""SELECT count(*) AS rows,
              md5(COALESCE(string_agg(id::text||':'||COALESCE(updated_at::text,''),'|' ORDER BY id),'')) AS state
              FROM public.followup_cases""")
            case_state=cur.fetchone()
            return {"database_mb":mb,"active_connections":connections["total"],"active_other_queries":connections["active"],
              "migration_094_present":migration,"migration_tracker_094":tracker,"migration_artifacts":artifacts,"pointer_columns":pointers,
              "cases":cases,"quality":quality,"active_runs":runs,"recoveries":recoveries,
              "cron_jobs":jobs,"cron_off":cron_pass,"schema_digest":digest,"case_state":case_state}
          def main():
            mode=sys.argv[1]
            with psycopg.connect(os.environ["PROD_DATABASE_URL"],connect_timeout=15,row_factory=dict_row) as conn:
              conn.execute("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY")
              conn.execute("SET LOCAL statement_timeout='8000ms'")
              cur=conn.cursor()
              data=snapshot(cur)
              if mode=="pre":
                baseline.write_text(json.dumps(data,sort_keys=True),encoding="utf-8")
                busy=data["active_runs"]>0 or data["recoveries"]["active"]>0
                data["active_checkpoint_in_progress"]=busy
                data["precheck_pass"]=(not data["migration_094_present"] and not busy
                  and data["recoveries"]["pending"]==0 and data["cron_off"])
                with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  out.write("precheck_pass="+str(data["precheck_pass"]).lower()+"\n")
                if not data["precheck_pass"]: sys.exit(1)
              else:
                before=json.loads(baseline.read_text(encoding="utf-8"))
                data["no_mutation_assertion"]="PASS" if (
                  not data["migration_094_present"] and data["schema_digest"]==before["schema_digest"]
                  and data["case_state"]==before["case_state"] and data["cron_jobs"]==before["cron_jobs"]
                ) else "FAIL"
                if data["no_mutation_assertion"]!="PASS": sys.exit(1)
              conn.rollback()
            safe=json.dumps(data,sort_keys=True,default=str)
            print(safe)
            with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("Read-only Production preflight "+mode+"\n"+safe+"\n")
            if mode=="pre":
              print("BACKFILL_DRY_RUN=NOT_RUN (pre-094 operator tool selects post-094 columns)")
              print("V3=UNKNOWN; SAFE_TO_BEGIN_094_ROLLOUT=NO")
          if __name__=="__main__": main()
          PY

      - name: Production database read-only preflight
        id: preflight
        if: steps.identity.outputs.identity_ok == 'true'
        env:
          PROD_DATABASE_URL: __GITHUB_EXPR_OPEN__ secrets.PROD_DATABASE_URL __GITHUB_EXPR_CLOSE__
        run: python "$RUNNER_TEMP/preflight.py" pre

      - name: Final read-only no-mutation assertion
        if: always() && steps.identity.outputs.identity_ok == 'true'
        env:
          PROD_DATABASE_URL: __GITHUB_EXPR_OPEN__ secrets.PROD_DATABASE_URL __GITHUB_EXPR_CLOSE__
        run: python "$RUNNER_TEMP/preflight.py" post

      - name: Report unavailable deployment metadata
        if: always()
        run: |
          echo "Production app commit: NOT_AVAILABLE_IN_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "V3 runtime: UNKNOWN; no Vercel metadata credential is configured." >> "$GITHUB_STEP_SUMMARY"
          echo "SAFE_TO_BEGIN_094_ROLLOUT: NO while V3 remains unverified." >> "$GITHUB_STEP_SUMMARY"
          echo "No database write, migration, backfill, cron change, deployment, or V3 change was made." >> "$GITHUB_STEP_SUMMARY"
