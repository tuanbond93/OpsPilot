name: OpsPilot Production Read-Only Liveness Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opspilot-production-read-only-liveness
  cancel-in-progress: false
jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: opspilot-production-rollout
    steps:
      - name: Verify Production project identity before database access
        shell: bash
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlparse
          prod = "elwnbwimgzijuelfjdsq"
          shadow = "qkrpbompjwxfpicjfoub"
          parsed = urlparse(os.environ.get("PROD_SUPABASE_URL", ""))
          host = (parsed.hostname or "").lower().rstrip(".")
          ref = host[:-len(".supabase.co")] if host.endswith(".supabase.co") else ""
          if parsed.scheme.lower() != "https" or host != prod + ".supabase.co" or ref != prod or ref == shadow:
              print("PRODUCTION_IDENTITY=FAIL")
              sys.exit(1)
          print("PRODUCTION_IDENTITY=PASS; PROJECT_REF=" + prod)
          PY
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Read-only live execution evidence
        shell: bash
        env:
          PGHOST: ${{ secrets.PROD_DB_HOST }}
          PGPORT: ${{ secrets.PROD_DB_PORT }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGDATABASE: ${{ secrets.PROD_DB_NAME }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
          PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=8000"
        run: |
          set -euo pipefail
          psql -X -qAt -v ON_ERROR_STOP=1 -c "select current_database(), current_user, version();" >/dev/null
          echo "DB_CONNECTION=PASS"
          cat > "$RUNNER_TEMP/liveness.sql" <<'SQL'
          WITH runs AS MATERIALIZED (
            SELECT id, status, current_phase, checkpoint_at, started_at, completed_at,
                   completed_phases,
                   round((extract(epoch FROM statement_timestamp() - checkpoint_at) / 60)::numeric, 2) AS age_from_checkpoint_minutes,
                   round((extract(epoch FROM statement_timestamp() - started_at) / 60)::numeric, 2) AS age_from_started_minutes
            FROM public.sync_runs
            WHERE lower(status::text) IN ('running','failed')
              AND COALESCE(current_phase::text,'') <> 'COMPLETED'
          ), activity AS (
            SELECT a.pid, a.application_name, a.state, a.query_start,
                   round(extract(epoch FROM statement_timestamp() - a.query_start)::numeric,2) AS query_age_seconds,
                   a.wait_event_type, a.wait_event, pg_blocking_pids(a.pid) AS blocking_pids,
                   ARRAY(SELECT r.id::text FROM runs r WHERE COALESCE(a.query,'') ILIKE '%' || r.id::text || '%') AS target_run_ids,
                   md5(COALESCE(a.query,'')) AS query_fingerprint
            FROM pg_stat_activity a
            WHERE a.pid <> pg_backend_pid()
              AND a.datname = current_database()
              AND a.state = 'active'
              AND (
                lower(COALESCE(a.application_name,'')) LIKE '%opspilot%'
                OR lower(COALESCE(a.query,'')) ~ '(opspilot|followup|sync_runs|sync_locks|checkpoint|enqueue_ai|enqueue_notifications)'
                OR EXISTS (SELECT 1 FROM runs r WHERE COALESCE(a.query,'') ILIKE '%' || r.id::text || '%')
              )
          ), lease AS (
            SELECT COALESCE(jsonb_agg(jsonb_build_object(
                     'lock_key',lock_key,'acquired_at',acquired_at,'heartbeat_at',heartbeat_at,
                     'heartbeat_age_seconds',round(extract(epoch FROM statement_timestamp()-heartbeat_at)::numeric,2),
                     'expires_at',expires_at,'unexpired',expires_at>statement_timestamp()
                   )),'[]'::jsonb) AS rows,
                   COALESCE(bool_or(expires_at>statement_timestamp()),false) AS unexpired
            FROM public.sync_locks
            WHERE lock_key='global:rillnet-sync'
          ), recovery AS (
            SELECT COALESCE(jsonb_agg(jsonb_build_object(
                     'checkpoint_at',c.checkpoint_at,'sync_run_id',c.sync_run_id,'status',c.status,
                     'recovery_attempt',c.recovery_attempt,'scheduled_for',c.scheduled_for,
                     'next_attempt_at',c.next_attempt_at,'dispatch_started_at',c.dispatch_started_at,
                     'last_http_status',c.last_http_status,'failure_stage',c.failure_stage
                   ) ORDER BY c.created_at),'[]'::jsonb) AS rows,
                   COALESCE(bool_or(upper(c.status::text) IN ('DISPATCHING','RUNNING')),false) AS active
            FROM public.checkpoint_recoveries c
            WHERE EXISTS (
              SELECT 1 FROM runs r
              WHERE r.id=c.sync_run_id OR (r.checkpoint_at IS NOT NULL AND r.checkpoint_at=c.checkpoint_at)
            )
          ), cron_state AS (
            SELECT count(*) AS jobs_found,
                   COALESCE(bool_and(j.active IS FALSE),false) AS all_off,
                   COALESCE(jsonb_agg(jsonb_build_object('jobid',j.jobid,'jobname',j.jobname,'schedule',j.schedule,'active',j.active) ORDER BY j.jobid),'[]'::jsonb) AS rows
            FROM cron.job j
            WHERE j.jobid::text IN ('14','15','16','17')
          ), phase_sources AS (
            SELECT count(*) AS candidate_sources
            FROM (
              SELECT table_name
              FROM information_schema.columns
              WHERE table_schema='public'
              GROUP BY table_name
              HAVING bool_or(column_name='sync_run_id')
                 AND bool_or(column_name IN ('phase','phase_name','current_phase'))
                 AND bool_or(column_name IN ('created_at','started_at','event_at','occurred_at','finished_at'))
            ) s
          )
          SELECT jsonb_build_object(
            'observed_at',statement_timestamp(),
            'nonterminal_db_rows',(SELECT count(*) FROM runs),
            'runs',COALESCE((SELECT jsonb_agg(jsonb_build_object(
              'run_id',r.id,'status',r.status,'current_phase',r.current_phase,'checkpoint_at',r.checkpoint_at,
              'started_at',r.started_at,'completed_at',r.completed_at,
              'last_completed_phase',r.completed_phases ->> -1,
              'age_from_checkpoint_minutes',r.age_from_checkpoint_minutes,
              'age_from_last_phase_event_minutes',NULL,
              'last_phase_event_at','NOT_AVAILABLE_IN_REPO_SCHEMA'
            ) ORDER BY r.checkpoint_at) FROM runs r),'[]'::jsonb),
            'phase_event_candidate_sources',(SELECT candidate_sources FROM phase_sources),
            'active_db_session_matches',COALESCE((SELECT jsonb_agg(jsonb_build_object(
              'pid',a.pid,'application_name',a.application_name,'state',a.state,'query_start',a.query_start,
              'query_age_seconds',a.query_age_seconds,'wait_event_type',a.wait_event_type,'wait_event',a.wait_event,
              'blocking_pids',a.blocking_pids,'target_run_ids',a.target_run_ids,'query_fingerprint',a.query_fingerprint
            ) ORDER BY a.query_start) FROM activity a),'[]'::jsonb),
            'exact_target_run_query_found',EXISTS(SELECT 1 FROM activity a WHERE cardinality(a.target_run_ids)>0),
            'generic_matching_active_query_found',EXISTS(SELECT 1 FROM activity),
            'matching_lock_waiters',COALESCE((SELECT jsonb_agg(jsonb_build_object('pid',a.pid,'blocking_pids',a.blocking_pids,'query_start',a.query_start)) FROM activity a WHERE cardinality(a.blocking_pids)>0),'[]'::jsonb),
            'matching_advisory_locks',COALESCE((SELECT jsonb_agg(jsonb_build_object('pid',l.pid,'mode',l.mode,'granted',l.granted,'classid',l.classid::text,'objid',l.objid::text,'objsubid',l.objsubid)) FROM pg_locks l JOIN activity a ON a.pid=l.pid WHERE l.locktype='advisory'),'[]'::jsonb),
            'sync_lease',(SELECT rows FROM lease),
            'sync_lease_unexpired',(SELECT unexpired FROM lease),
            'checkpoint_recoveries',(SELECT rows FROM recovery),
            'active_checkpoint_recovery',(SELECT active FROM recovery),
            'cron_jobs',(SELECT rows FROM cron_state),
            'cron_14_to_17_all_off',(SELECT jobs_found=4 AND all_off FROM cron_state),
            'route_max_duration_seconds',300,
            'live_sync_execution_found',CASE
              WHEN EXISTS(SELECT 1 FROM activity a WHERE cardinality(a.target_run_ids)>0) THEN 'YES'
              WHEN EXISTS(SELECT 1 FROM activity)
                OR (SELECT unexpired FROM lease)
                OR (SELECT active FROM recovery)
                OR EXISTS(SELECT 1 FROM activity a WHERE cardinality(a.blocking_pids)>0) THEN 'UNKNOWN'
              WHEN (SELECT count(*) FROM runs)=0 THEN 'NO'
              WHEN (SELECT max(started_at) FROM runs)<statement_timestamp()-interval '6 minutes'
                AND (SELECT jobs_found=4 AND all_off FROM cron_state) THEN 'NO'
              ELSE 'UNKNOWN'
            END
          )::text;
          SQL
          psql -X -qAt -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f "$RUNNER_TEMP/liveness.sql"
          echo "NARROW_READ_ONLY_LIVENESS_QUERY=PASS"
