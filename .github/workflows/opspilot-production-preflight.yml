name: OpsPilot Production 094 Resume Backfill

on:
  workflow_dispatch:
    inputs:
      confirm_production_ref:
        description: "Type the exact Primary Production Supabase project ref"
        required: true
        type: string
      approve_database_mutations:
        description: "Explicitly authorize bounded backfill; migration 094 must already be applied"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"
      execution_mode:
        description: "AUDIT_ONLY and DRY_RUN_ONLY are read-only; APPLY_BACKFILL requires explicit YES"
        required: true
        default: "AUDIT_ONLY"
        type: choice
        options:
          - "AUDIT_ONLY"
          - "DRY_RUN_ONLY"
          - "APPLY_BACKFILL"

permissions:
  contents: read

concurrency:
  group: opspilot-production-094-rollout
  cancel-in-progress: false

jobs:
  migrate-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: opspilot-production-rollout
    env:
      EXPECTED_PRODUCTION_REF: elwnbwimgzijuelfjdsq
      SHADOW_REF: qkrpbompjwxfpicjfoub
      TESTED_CANDIDATE_SHA: aab4126d052c10091e125cfa7cc50dcf0247a068
      CONFIRM_PRODUCTION_REF: ${{ inputs.confirm_production_ref }}
      APPROVE_DATABASE_MUTATIONS: ${{ inputs.approve_database_mutations }}
      PROD_EXECUTION_MODE: ${{ inputs.execution_mode }}
      PROD_V3_FLAG: ${{ vars.SNAPSHOT_V3_SHADOW_ENABLED }}

    steps:
      - name: Fail closed on operator inputs, Production identity, and V3 flag
        shell: bash
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from urllib.parse import urlparse
          expected = os.environ["EXPECTED_PRODUCTION_REF"]
          shadow = os.environ["SHADOW_REF"]
          url = urlparse(os.environ.get("PROD_SUPABASE_URL", ""))
          host = (url.hostname or "").lower().rstrip(".")
          ref = host[:-len(".supabase.co")] if host.endswith(".supabase.co") else ""
          if os.environ.get("CONFIRM_PRODUCTION_REF") != expected:
              print("PRODUCTION_IDENTITY=FAIL; INPUT_REF_MISMATCH")
              sys.exit(1)
          if url.scheme.lower() != "https" or host != expected + ".supabase.co" or ref != expected or ref == shadow:
              print("PRODUCTION_IDENTITY=FAIL; URL_REF_MISMATCH")
              sys.exit(1)
          mode = os.environ.get("PROD_EXECUTION_MODE")
          if mode not in ("AUDIT_ONLY", "DRY_RUN_ONLY", "APPLY_BACKFILL"):
              print("EXECUTION_MODE=FAIL")
              sys.exit(1)
          approval = os.environ.get("APPROVE_DATABASE_MUTATIONS")
          if mode == "APPLY_BACKFILL" and approval != "YES":
              print("DATABASE_MUTATION_APPROVAL=FAIL")
              sys.exit(1)
          if mode != "APPLY_BACKFILL" and approval == "YES":
              print("READ_ONLY_MODE_REQUIRES_APPROVAL_NO")
              sys.exit(1)
          if os.environ.get("PROD_V3_FLAG", "").strip().lower() != "false":
              print("V3=UNKNOWN_OR_ON; EXPECT_GITHUB_ENVIRONMENT_VARIABLE_SNAPSHOT_V3_SHADOW_ENABLED_FALSE")
              sys.exit(1)
          print("PRODUCTION_IDENTITY=PASS; PROJECT_REF=" + expected)
          print("EXECUTION_MODE=" + mode)
          print("DATABASE_MUTATION_APPROVAL=" + ("PASS" if mode == "APPLY_BACKFILL" else "NOT_REQUIRED_READ_ONLY"))
          print("V3=OFF; SOURCE=GITHUB_ENVIRONMENT_VARIABLE")
          PY

      - name: Checkout operation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact tested migration and backfill candidate
        uses: actions/checkout@v4
        with:
          ref: aab4126d052c10091e125cfa7cc50dcf0247a068
          path: candidate
          persist-credentials: false

      - name: Verify pinned candidate source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "$TESTED_CANDIDATE_SHA"
          test -s candidate/src/database/migrations/094_normalized_followup_case_members.sql
          test -s candidate/src/services/followup-cohort-backfill.ts
          test -s candidate/src/domain/operational-learning/normalized-followup-members.ts
          echo "TESTED_MIGRATION_SOURCE=PASS"
          echo "TESTED_BACKFILL_SOURCE=PASS"

      - name: Install candidate Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install candidate dependencies
        shell: bash
        run: |
          npm install -g npm@11
          cd candidate
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Prepare fail-closed read-only preflight and parity verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/opspilot-prod-094-preflight.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          mode="$1"
          python - <<'PY'
          import os, sys
          from urllib.parse import urlparse
          expected = "elwnbwimgzijuelfjdsq"
          shadow = "qkrpbompjwxfpicjfoub"
          url = urlparse(os.environ.get("PROD_SUPABASE_URL", ""))
          host = (url.hostname or "").lower().rstrip(".")
          ref = host[:-len(".supabase.co")] if host.endswith(".supabase.co") else ""
          if os.environ.get("CONFIRM_PRODUCTION_REF") != expected or url.scheme.lower() != "https" or host != expected + ".supabase.co" or ref != expected or ref == shadow:
              print("PRODUCTION_IDENTITY=FAIL")
              sys.exit(1)
          mode = os.environ.get("PROD_EXECUTION_MODE")
          if mode not in ("AUDIT_ONLY", "DRY_RUN_ONLY", "APPLY_BACKFILL"):
              print("EXECUTION_MODE=FAIL")
              sys.exit(1)
          approval = os.environ.get("APPROVE_DATABASE_MUTATIONS")
          if mode == "APPLY_BACKFILL" and approval != "YES":
              print("DATABASE_MUTATION_APPROVAL=FAIL")
              sys.exit(1)
          if mode != "APPLY_BACKFILL" and approval == "YES":
              print("READ_ONLY_MODE_REQUIRES_APPROVAL_NO")
              sys.exit(1)
          if os.environ.get("PROD_V3_FLAG", "").strip().lower() != "false":
              print("V3=UNKNOWN_OR_ON")
              sys.exit(1)
          PY
          cat > "$RUNNER_TEMP/opspilot-prod-094-preflight.sql" <<'SQL'
          WITH jobs AS (
            SELECT jobid, active FROM cron.job WHERE jobid::text IN ('14','15','16','17')
          ), matching_sessions AS (
            SELECT a.pid, a.application_name, a.state, a.query,
                   pg_blocking_pids(a.pid) AS blockers
            FROM pg_stat_activity AS a
            WHERE a.pid <> pg_backend_pid()
              AND a.datname = current_database()
              AND (
                lower(coalesce(a.application_name,'')) LIKE '%opspilot%'
                OR lower(coalesce(a.query,'')) ~ '(sync_runs|sync_locks|followup|checkpoint|enqueue|notification|recovery)'
              )
          ), artifacts AS (
            SELECT
              (SELECT count(*) FROM (VALUES
                ('public.followup_case_members'),
                ('public.followup_case_member_generations'),
                ('public.followup_case_cohort_archive')
              ) AS expected(object_name) WHERE to_regclass(expected.object_name) IS NOT NULL) AS table_count,
              (SELECT count(*) FROM (VALUES
                ('followup_cases','cohort_version'),
                ('followup_cases','member_generation_id')
              ) AS expected(table_name,column_name)
               WHERE EXISTS (
                 SELECT 1 FROM information_schema.columns AS c
                 WHERE c.table_schema='public'
                   AND c.table_name=expected.table_name
                   AND c.column_name=expected.column_name
               )) AS column_count,
              EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conrelid='public.followup_cases'::regclass
                  AND conname='followup_cases_cohort_generation_consistency'
              ) AS consistency_constraint
          )
          SELECT jsonb_build_object(
            'jobs_found',(SELECT count(*) FROM jobs),
            'all_jobs_off',coalesce((SELECT bool_and(active IS FALSE) FROM jobs),false),
            'active_matching_sessions',(SELECT count(*) FROM matching_sessions WHERE state='active'),
            'matching_lock_waiters',(SELECT count(*) FROM matching_sessions WHERE cardinality(blockers)>0),
            'matching_advisory_locks',(
              SELECT count(*) FROM pg_locks AS l
              JOIN matching_sessions AS s ON s.pid=l.pid
              WHERE l.locktype='advisory' AND l.granted
            ),
            'unexpired_sync_lease',EXISTS (
              SELECT 1 FROM public.sync_locks
              WHERE lock_key='global:rillnet-sync' AND expires_at>statement_timestamp()
            ),
            'nonterminal_recoveries',(
              SELECT count(*) FROM public.checkpoint_recoveries
              WHERE upper(status::text) IN ('PENDING','DISPATCHING','RUNNING')
            ),
            'recent_running_runs',(
              SELECT count(*) FROM public.sync_runs
              WHERE lower(status::text) IN ('running','dispatching')
                AND started_at >= statement_timestamp()-interval '6 minutes'
            ),
            'migration_table_count',(SELECT table_count FROM artifacts),
            'migration_column_count',(SELECT column_count FROM artifacts),
            'migration_constraint_present',(SELECT consistency_constraint FROM artifacts),
            'pointer_count',(SELECT count(*) FROM public.followup_cases
              WHERE cohort_version=2 OR member_generation_id IS NOT NULL),
            'member_count',(SELECT count(*) FROM public.followup_case_members),
            'generation_count',(SELECT count(*) FROM public.followup_case_member_generations),
            'archive_count',(SELECT count(*) FROM public.followup_case_cohort_archive),
            'followup_cases_total',(SELECT count(*) FROM public.followup_cases),
            'active_v1_nonnull_cohorts',(
              SELECT count(*) FROM public.followup_cases
              WHERE coalesce(current_state::text,'') <> 'CLOSED'
                AND operational_cohort IS NOT NULL
            ),
            'active_v1_null_cohorts',(
              SELECT count(*) FROM public.followup_cases
              WHERE coalesce(current_state::text,'') <> 'CLOSED'
                AND operational_cohort IS NULL
            )
          )::text;
          SQL
          mode="$mode"
          if ! gate="$(psql -X -qAt -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/opspilot-prod-094-preflight.sql" 2>"$RUNNER_TEMP/opspilot-prod-094-psql.err")"; then
            state="$(grep -Eo '[0-9A-Z]{5}' "$RUNNER_TEMP/opspilot-prod-094-psql.err" | tail -n 1 || true)"
            echo "READ_ONLY_PREFLIGHT=FAIL; SQLSTATE=${state:-UNKNOWN}"
            exit 1
          fi
          GATE_JSON="$gate" PREFLIGHT_MODE="$mode" python - <<'PY'
          import json, os, sys
          try:
              g=json.loads(os.environ["GATE_JSON"])
          except Exception:
              print("READ_ONLY_PREFLIGHT=FAIL; RESULT_PARSE")
              sys.exit(1)
          mode=os.environ["PREFLIGHT_MODE"]
          checks = {
              "cron_14_17_off": g["jobs_found"] == 4 and g["all_jobs_off"],
              "no_active_matching_sessions": g["active_matching_sessions"] == 0,
              "no_lock_waiters": g["matching_lock_waiters"] == 0,
              "no_matching_advisory_locks": g["matching_advisory_locks"] == 0,
              "no_unexpired_sync_lease": not g["unexpired_sync_lease"],
              "no_nonterminal_recovery": g["nonterminal_recoveries"] == 0,
              "no_recent_running_checkpoint": g["recent_running_runs"] == 0,
          }
          artifacts=g["migration_table_count"] + g["migration_column_count"] + int(g["migration_constraint_present"])
          if mode in ("PRESENT_EMPTY", "PRESENT"):
              checks["migration_094_complete"] = (
                  g["migration_table_count"] == 3
                  and g["migration_column_count"] == 2
                  and g["migration_constraint_present"]
              )
              if mode == "PRESENT_EMPTY":
                  checks["no_v2_pointers_or_rows"] = (
                      g["pointer_count"] == 0
                      and g["member_count"] == 0
                      and g["generation_count"] == 0
                      and g["archive_count"] == 0
                  )
          else:
              checks["mode_valid"] = False
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              print("READ_ONLY_PREFLIGHT=FAIL; GATES=" + ",".join(failed))
              sys.exit(1)
          print("READ_ONLY_PREFLIGHT=PASS; MODE=" + mode)
          print("MIGRATION_094=APPLIED; TABLES=" + str(g["migration_table_count"]) + "; COLUMNS=" + str(g["migration_column_count"]) + "; CONSTRAINT=" + str(g["migration_constraint_present"]))
          print("V2_POINTERS=" + str(g["pointer_count"]) + "; MEMBERS=" + str(g["member_count"]) + "; GENERATIONS=" + str(g["generation_count"]) + "; ARCHIVES=" + str(g["archive_count"]))
          print("FOLLOWUP_CASES_TOTAL=" + str(g["followup_cases_total"]))
          print("ACTIVE_V1_NONNULL_COHORTS=" + str(g["active_v1_nonnull_cohorts"]))
          print("ACTIVE_V1_NULL_COHORTS=" + str(g["active_v1_null_cohorts"]))
          print("CRON_14_17=OFF")
          print("LIVE_SYNC_EXECUTION=NONE")
          print("RECOVERY_OR_LEASE=NONE")
          print("MIGRATION_ARTIFACTS=" + str(artifacts))
          PY
          BASH
          chmod +x "$RUNNER_TEMP/opspilot-prod-094-preflight.sh"
          cat > candidate/src/scripts/opspilot-production-094-gate.ts <<'TS'
          import { createHash } from "node:crypto";
          import { appendFileSync } from "node:fs";
          import { createClient } from "@supabase/supabase-js";
          import {
            assertFollowupMemberGenerationParity,
            isOperationalCohortV2Metadata,
            operationalCohortMemberRows,
            operationalCohortV2Metadata,
            planFollowupMemberWriteChunks,
          } from "../domain/operational-learning/normalized-followup-members";
          import { runFollowupCohortBackfillBatch } from "../services/followup-cohort-backfill";

          const PAGE_CASES = 5;
          const MEMBER_PAGE = 500;
          const V1_FIELDS = "id,incident_key,current_state,updated_at,cohort_version,member_generation_id,operational_cohort";
          const MEMBER_FIELDS = "followup_case_id,generation_id,source_sync_run_id,order_code,customer_id,warehouse_id,stage,status,observed_at,ready_at,source,baseline_status,is_baseline,due_at,last_reminder_at,last_reminder_status,completed_at,member_active,verification_failure";
          const client = createClient(
            process.env.PROD_SUPABASE_URL || "",
            process.env.PROD_SERVICE_ROLE_KEY || "",
            { auth: { autoRefreshToken: false, persistSession: false } },
          );
          const allowedStages = new Set(["DELIVERY", "TRANSIT", "OUTBOUND", "UNKNOWN"]);
          const allowedSources = new Set(["rillnet", "ghn_internal_order_logs"]);
          const dryGeneration = "00000000-0000-4000-8000-000000000000";

          function requireEnv(name: string): string {
            const value = process.env[name];
            if (!value) throw new Error("REQUIRED_ENV_MISSING:" + name);
            return value;
          }
          function sha(value: unknown): string {
            return createHash("sha256").update(JSON.stringify(value) ?? "undefined").digest("hex");
          }
          function isDate(value: unknown, nullable: boolean): boolean {
            if (value === null || value === undefined) return nullable;
            return typeof value === "string" && Number.isFinite(Date.parse(value));
          }
          function isCheckpointKey(value: unknown): boolean {
            return typeof value === "string" && /^\d{4}-\d{2}-\d{2}:(8|10|14|18|20)$/.test(value);
          }
          function isValidDay(value: unknown): boolean {
            if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const parsed = new Date(value + "T00:00:00.000Z");
            return Number.isFinite(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value;
          }
          function isVerificationMetadataValid(value: any): boolean {
            if (value === undefined) return true;
            return Boolean(value && typeof value === "object"
              && value.source === "ghn_internal_order_logs"
              && isDate(value.checkedAt, false)
              && (value.snapshotAt === undefined || isDate(value.snapshotAt, false))
              && value.failures && typeof value.failures === "object"
              && !Array.isArray(value.failures)
              && Object.values(value.failures).every((failure) => typeof failure === "string"));
          }
          function text(value: unknown): value is string {
            return typeof value === "string" && value.trim().length > 0;
          }
          function validateCase(row: any, archive: any | undefined): number {
            const cohort = row.operational_cohort;
            if (!row.updated_at || !cohort || cohort.version !== 1
                || !Array.isArray(cohort.members) || !Array.isArray(cohort.baselineCodes)) {
              throw new Error("V1_COHORT_SHAPE_INVALID");
            }
          if (new Set(cohort.baselineCodes).size !== cohort.baselineCodes.length
                || cohort.baselineCodes.some((code: unknown) => !text(code))) {
              throw new Error("BASELINE_KEY_INVALID");
            }
            if (!text(cohort.day) || !isDate(cohort.capturedAt, false)
                || (cohort.lastCheckpoint !== undefined && !isCheckpointKey(cohort.lastCheckpoint))) {
              throw new Error("COHORT_METADATA_INVALID");
            }
            if (cohort.verification !== undefined) {
              const verification = cohort.verification;
              if (!verification || typeof verification !== "object"
                  || verification.source !== "ghn_internal_order_logs"
                  || !isDate(verification.checkedAt, false)
                  || (verification.snapshotAt !== undefined && !isDate(verification.snapshotAt, false))
                  || !verification.failures || typeof verification.failures !== "object"
                  || Array.isArray(verification.failures)
                  || Object.values(verification.failures).some((value) => typeof value !== "string")) {
                throw new Error("VERIFICATION_DATA_INVALID");
              }
            }
            for (const member of cohort.members) {
              if (!member || !text(member.orderCode) || !text(member.customerId) || !text(member.warehouseId)
                  || !allowedStages.has(member.stage) || !text(member.status) || !isDate(member.observedAt, false)
                  || !text(member.baselineStatus)
                  || (member.source !== undefined && member.source !== null && !allowedSources.has(member.source))
                  || !isDate(member.readyAt, true) || !isDate(member.dueAt, true)
                  || !isDate(member.lastReminderAt, true) || !isDate(member.completedAt, true)
                  || (member.lastReminderStatus !== undefined && member.lastReminderStatus !== null && typeof member.lastReminderStatus !== "string")) {
                throw new Error("MEMBER_FIELD_INVALID");
              }
            }
            const expected = operationalCohortMemberRows(row.id, dryGeneration, null, cohort);
            planFollowupMemberWriteChunks(expected);
            const metadata = operationalCohortV2Metadata(cohort);
            if (Buffer.byteLength(JSON.stringify(metadata), "utf8") > 131072) {
              throw new Error("V2_METADATA_LIMIT_EXCEEDED");
            }
            if (archive && (
                archive.source_cohort_sha256 !== sha(cohort)
                || archive.source_case_updated_at !== row.updated_at
              )) {
              throw new Error("IMMUTABLE_ARCHIVE_SOURCE_MISMATCH");
            }
            return cohort.members.length;
          }
          async function eligiblePage(afterId: string | null): Promise<any[]> {
            let q = (client.from("followup_cases") as any)
              .select(V1_FIELDS)
              .neq("current_state", "CLOSED")
              .is("member_generation_id", null)
              .or("cohort_version.is.null,cohort_version.eq.1")
              .not("operational_cohort", "is", null)
              .order("id", { ascending: true })
              .limit(PAGE_CASES);
            if (afterId) q = q.gt("id", afterId);
            const { data, error } = await q;
            if (error) throw new Error("ELIGIBLE_CASE_READ_FAILED");
            return data || [];
          }
          async function countNullCohortV1(): Promise<number> {
            const { count, error } = await (client.from("followup_cases") as any)
              .select("id", { count: "exact", head: true })
              .neq("current_state", "CLOSED")
              .is("member_generation_id", null)
              .or("cohort_version.is.null,cohort_version.eq.1")
              .is("operational_cohort", null);
            if (error) throw new Error("NULL_COHORT_COUNT_FAILED");
            return count || 0;
          }
          async function dryRun(): Promise<void> {
            let cursor: string | null = null;
            let wouldMigrate = 0;
            let wouldFail = 0;
            let memberTotal = 0;
            const reasons = new Map<string, number>();
            for (;;) {
              const cases = await eligiblePage(cursor);
              if (!cases.length) break;
              const ids = cases.map((row: any) => row.id);
              const { data: archives, error: archiveError } = await (client.from("followup_case_cohort_archive") as any)
                .select("followup_case_id,source_case_updated_at,source_cohort_sha256")
                .in("followup_case_id", ids);
              if (archiveError) throw new Error("ARCHIVE_READ_FAILED");
              const archiveByCase = new Map((archives || []).map((row: any) => [row.followup_case_id, row]));
              for (const row of cases) {
                try {
                  const count = validateCase(row, archiveByCase.get(row.id));
                  memberTotal += count;
                  wouldMigrate++;
                } catch (error) {
                  wouldFail++;
                  const message = error instanceof Error ? error.message : "UNKNOWN";
                  reasons.set(message, (reasons.get(message) || 0) + 1);
                }
              }
              cursor = cases[cases.length - 1].id;
              if (cases.length < PAGE_CASES) break;
            }
            const wouldSkip = await countNullCohortV1();
            const env = requireEnv("GITHUB_ENV");
            appendFileSync(env,
              "BACKFILL_WOULD_MIGRATE=" + wouldMigrate + "\n"
              + "BACKFILL_WOULD_SKIP=" + wouldSkip + "\n"
              + "BACKFILL_WOULD_FAIL=" + wouldFail + "\n");
            console.log("BACKFILL_DRY_RUN=PASS");
            console.log("BACKFILL_WOULD_MIGRATE=" + wouldMigrate);
            console.log("BACKFILL_WOULD_SKIP_NULL_COHORT=" + wouldSkip);
            console.log("BACKFILL_WOULD_FAIL=" + wouldFail);
            console.log("ELIGIBLE_MEMBER_ROWS=" + memberTotal);
            if (reasons.size) {
              console.log("FAILURE_CATEGORIES=" + Array.from(reasons.entries()).map(([key,value]) => key + ":" + value).join(","));
            }
            if (wouldFail !== 0) throw new Error("BACKFILL_WOULD_FAIL_MUST_BE_ZERO");
          }
          async function auditMetadata(): Promise<void> {
            const counts = {
              VERSION_INVALID: 0,
              DAY_MISSING_OR_INVALID: 0,
              CAPTURED_AT_MISSING_OR_INVALID_TIMESTAMP: 0,
              LAST_CHECKPOINT_MISSING: 0,
              LAST_CHECKPOINT_VALID_CHECKPOINT_KEY: 0,
              LAST_CHECKPOINT_INVALID_KEY: 0,
              VERIFICATION_METADATA_INVALID: 0,
            };
            const examples = new Set<string>();
            let cursor: string | null = null;
            let eligible = 0;
            for (;;) {
              const cases = await eligiblePage(cursor);
              if (!cases.length) break;
              for (const row of cases) {
                eligible++;
                const cohort = row.operational_cohort;
                if (!cohort || typeof cohort !== "object" || cohort.version !== 1) counts.VERSION_INVALID++;
                if (!cohort || typeof cohort !== "object" || !isValidDay(cohort.day)) counts.DAY_MISSING_OR_INVALID++;
                if (!cohort || typeof cohort !== "object" || !isDate(cohort.capturedAt, false)) counts.CAPTURED_AT_MISSING_OR_INVALID_TIMESTAMP++;
                const checkpoint = cohort && typeof cohort === "object" ? cohort.lastCheckpoint : undefined;
                if (checkpoint === undefined) counts.LAST_CHECKPOINT_MISSING++;
                else if (isCheckpointKey(checkpoint)) counts.LAST_CHECKPOINT_VALID_CHECKPOINT_KEY++;
                else counts.LAST_CHECKPOINT_INVALID_KEY++;
                if (!cohort || typeof cohort !== "object" || !isVerificationMetadataValid(cohort.verification)) {
                  counts.VERIFICATION_METADATA_INVALID++;
                }
                if (examples.size < 5) {
                  const safe = checkpoint === undefined ? "<missing>"
                    : checkpoint === null ? "<null>"
                    : typeof checkpoint === "string" ? checkpoint.replace(/[^0-9:-]/g, "?").slice(0, 40)
                    : `<${typeof checkpoint}>`;
                  examples.add(safe);
                }
              }
              cursor = cases[cases.length - 1].id;
              if (cases.length < PAGE_CASES) break;
            }
            console.log("METADATA_AUDIT_ELIGIBLE=" + eligible);
            for (const [name, count] of Object.entries(counts)) console.log(name + "=" + count);
            console.log("LAST_CHECKPOINT_EXAMPLES=" + JSON.stringify([...examples]));
