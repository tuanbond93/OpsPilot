name: OpsPilot Shadow read-only cleanliness verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shadow:
    if: github.repository == 'tuanbond93/OpsPilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: opspilot-shadow-perf
    env:
      SHADOW_PROJECT_REF: qkrpbompjwxfpicjfoub
      PRIMARY_PROJECT_REF: elwnbwimgzijuelfjdsq
      EXPECTED_PRETEST_DIGEST: 23a13e47f5d039da860134713730187e

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify Shadow cleanliness using read-only SQL
        env:
          SHADOW_SUPABASE_URL: ${{ secrets.SHADOW_SUPABASE_URL }}
          SHADOW_SERVICE_ROLE_KEY: ${{ secrets.SHADOW_SERVICE_ROLE_KEY }}
          SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
        run: node .github/scripts/opspilot-shadow-readonly-verify.mjs
